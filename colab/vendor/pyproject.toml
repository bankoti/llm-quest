[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-llm-course"
version = "0.1.0"
description = "Course package vendored for the LLM Quest Colab notebooks"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_llm"]
