name = "zeroone-beacon"
main = "index.js"
compatibility_date = "2026-08-01"

# 1) create the namespace:  npx wrangler kv namespace create COUNTS
# 2) paste the id it prints below
[[kv_namespaces]]
binding = "COUNTS"
id = "REPLACE_WITH_NAMESPACE_ID"

[vars]
# Lock CORS to the site origin (use "*" while testing locally)
ALLOW_ORIGIN = "https://bankoti.github.io"

# STATS_KEY is a secret, not a var:  npx wrangler secret put STATS_KEY
