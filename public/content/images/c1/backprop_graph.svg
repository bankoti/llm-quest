<text x="453.0" y="159.0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">dL/dy = 2(y−t) = 4</text>
<line x1="326" y1="165" x2="260" y2="165" stroke="#fb7185" stroke-width="1.6"/>
<line x1="260" y1="165" x2="252.28800121967947" y2="169.6395123463932" stroke="#fb7185" stroke-width="1.6"/>
<line x1="260" y1="165" x2="252.28800121967947" y2="160.3604876536068" stroke="#fb7185" stroke-width="1.6"/>
<text x="293.0" y="159.0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">dL/dm = 4</text>
<line x1="176" y1="165" x2="114" y2="190" stroke="#fb7185" stroke-width="1.6"/>
<line x1="114" y1="190" x2="108.58260320856553" y2="197.18691950728234" stroke="#fb7185" stroke-width="1.6"/>
<line x1="114" y1="190" x2="105.1125417891692" y2="188.58116718717946" stroke="#fb7185" stroke-width="1.6"/>
<text x="145.0" y="171.5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">dL/dw = 4·x = 8</text>
<text x="360" y="226" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">chain rule: each node multiplies the gradient flowing back by its local derivative</text>
</svg>
