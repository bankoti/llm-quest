<text x="121" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">model writes rules/tables,</text>
<text x="121" y="99" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">runtime is classical</text>
