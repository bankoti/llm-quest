<text x="496" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">cached answers first,</text>
<text x="496" y="151" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">model on misses w/ deadline</text>
