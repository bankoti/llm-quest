<text x="80" y="224" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="start" font-weight="400" opacity="1">far from request path (safe, stale)</text>
<text x="650" y="224" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="end" font-weight="400" opacity="1">in the request path (fresh, risky)</text>
