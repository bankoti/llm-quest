<text x="621" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">direct generation</text>
<text x="621" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">LLM call per request,</text>
<text x="621" y="99" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">full latency + cost exposure</text>
