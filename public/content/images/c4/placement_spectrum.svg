<text x="371" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">shared embeddings</text>
<text x="371" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">precomputed vectors,</text>
