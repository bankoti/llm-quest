<text x="180" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#60a5fa" text-anchor="middle" font-weight="600" opacity="1">HBM — large, slow</text>
<text x="180" y="104" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">~TB/s, tens of GB</text>
