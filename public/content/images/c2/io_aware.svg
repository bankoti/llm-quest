<rect x="152" y="150" width="30" height="30" rx="3" fill="#0b0f19" stroke="#1f2937" stroke-width="1" opacity="1"/>
<rect x="182" y="150" width="30" height="30" rx="3" fill="#0b0f19" stroke="#1f2937" stroke-width="1" opacity="1"/>
<rect x="212" y="150" width="30" height="30" rx="3" fill="#0b0f19" stroke="#1f2937" stroke-width="1" opacity="1"/>
<rect x="242" y="150" width="30" height="30" rx="3" fill="#0b0f19" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="180" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">Q, K, V and the (T,T) matrix live here naively</text>
<rect x="420" y="84" width="190" height="100" rx="10" fill="#34d39912" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="515" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#34d399" text-anchor="middle" font-weight="600" opacity="1">SRAM — tiny, fast</text>
<text x="515" y="126" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">~19 TB/s, ~20 MB</text>
<rect x="486" y="138" width="30" height="30" rx="3" fill="#fbbf2440" stroke="#1f2937" stroke-width="1" opacity="1"/>
<rect x="516" y="138" width="30" height="30" rx="3" fill="#fbbf2440" stroke="#1f2937" stroke-width="1" opacity="1"/>
