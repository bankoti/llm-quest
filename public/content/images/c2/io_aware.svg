<text x="360" y="240" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">FlashAttention never materializes the (T,T) score matrix in HBM:</text>
<text x="360" y="258" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">it processes K/V in tiles with an online softmax — exact result, far less memory traffic</text>
