<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="210" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">The bug: RMSNorm that secretly centers</text>
<text x="70" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#fb7185" text-anchor="start" font-weight="600" opacity="1">buggy &#x27;RMSNorm&#x27;</text>
<rect x="70" y="84" width="220" height="40" rx="8" fill="#fb718522" stroke="#fb7185" stroke-width="1.5" opacity="1"/>
<text x="180.0" y="108.0" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">(x − mean(x)) ÷ rms</text>
<text x="70" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#34d399" text-anchor="start" font-weight="600" opacity="1">actual RMSNorm</text>
<rect x="70" y="166" width="220" height="40" rx="8" fill="#34d39922" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="180.0" y="190.0" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">x ÷ rms(x)</text>
<text x="340" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">← this IS LayerNorm-without-bias</text>
<text x="340" y="124" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="400" opacity="1">passes eyeball tests: outputs look &#x27;normalized&#x27;</text>
<text x="340" y="186" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#34d399" text-anchor="start" font-weight="400" opacity="1">← the mean is deliberately kept</text>
</svg>
