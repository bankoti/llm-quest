<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="230" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">The bug: counting ties as wins</text>
<rect x="60" y="70" width="68" height="44" rx="8" fill="#34d39926" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="94" y="96" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600" opacity="1">win</text>
<rect x="140" y="70" width="68" height="44" rx="8" fill="#fbbf2426" stroke="#fbbf24" stroke-width="1.5" opacity="1"/>
<text x="174" y="96" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600" opacity="1">tie</text>
<rect x="220" y="70" width="68" height="44" rx="8" fill="#fbbf2426" stroke="#fbbf24" stroke-width="1.5" opacity="1"/>
<text x="254" y="96" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600" opacity="1">tie</text>
<rect x="300" y="70" width="68" height="44" rx="8" fill="#fb718526" stroke="#fb7185" stroke-width="1.5" opacity="1"/>
<text x="334" y="96" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="600" opacity="1">loss</text>
<rect x="380" y="70" width="68" height="44" rx="8" fill="#fbbf2426" stroke="#fbbf24" stroke-width="1.5" opacity="1"/>
<text x="414" y="96" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600" opacity="1">tie</text>
<text x="80" y="150" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">buggy:   (1 win + 3 ties) / 5 = 0.80   ← ties counted as wins</text>
<text x="80" y="176" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="400" opacity="1">correct: 1 win + 0.5 × 3 ties = 2.5 / 5 = 0.50</text>
<text x="360" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">a tie means the judge cannot tell the models apart — half a win each is the honest accounting</text>
</svg>
