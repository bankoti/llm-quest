<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="280" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">Linear vs exponential backoff under an outage</text>
<line x1="80" y1="60" x2="80" y2="220" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<line x1="80" y1="220" x2="620" y2="220" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<text x="350.0" y="246" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt</text>
<text x="52" y="140.0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" transform="rotate(-90 52 140.0)">delay (ms)</text>
<polyline points="80,220 188,200 296,180 404,160 512,140 620,120" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="380" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">linear — herd returns together</text>
<polyline points="80,212 188,204 296,188 404,156 512,92 620,70" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="340" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="400" opacity="1">exponential — spreads the herd</text>
<text x="360" y="264" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">exponential: delay = base × 2^attempt + jitter; cap at a max to bound worst case</text>
</svg>
