<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="260" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">Three telemetry types — different questions, same system</text>
<rect x="40" y="56" width="200" height="130" rx="10" fill="#a78bfa12" stroke="#a78bfa" stroke-width="1.5" opacity="1"/>
<text x="140" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="700" opacity="1">traces</text>
<text x="140" y="106" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">What happened to</text>
<text x="140" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">request r-abc-42?</text>
<text x="140" y="152" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">per-request journey</text>
<rect x="270" y="56" width="200" height="130" rx="10" fill="#67e8f912" stroke="#67e8f9" stroke-width="1.5" opacity="1"/>
<text x="370" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#67e8f9" text-anchor="middle" font-weight="700" opacity="1">metrics</text>
<text x="370" y="106" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">How many req/s failed</text>
<text x="370" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">in the last 5 minutes?</text>
<text x="370" y="152" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">aggregate statistics</text>
<rect x="500" y="56" width="200" height="130" rx="10" fill="#34d39912" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="600" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#34d399" text-anchor="middle" font-weight="700" opacity="1">logs</text>
<text x="600" y="106" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">Why did this request</text>
<text x="600" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">choose prompt variant B?</text>
<text x="600" y="152" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">discrete decisions</text>
<text x="360" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">all three are needed: metrics alert you, traces explain one, logs preserve the decision</text>
</svg>
