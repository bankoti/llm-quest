<line x1="340" y1="152" x2="335.3604876536068" y2="144.28800121967947" stroke="#fb7185" stroke-width="1.6"/>
<line x1="340" y1="152" x2="344.6395123463932" y2="144.28800121967947" stroke="#fb7185" stroke-width="1.6"/>
<text x="360" y="208" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">probe fails → back to OPEN</text>
<text x="360" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">OPEN state returns an error immediately — no waiting for a downstream that is already broken</text>
</svg>
