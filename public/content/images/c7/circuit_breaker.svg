<text x="249.0" y="109.0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">error rate &gt; threshold</text>
<line x1="460" y1="115" x2="498" y2="115" stroke="#9ca3af" stroke-width="1.6"/>
<line x1="498" y1="115" x2="505.7119987803205" y2="110.36048765360682" stroke="#9ca3af" stroke-width="1.6"/>
