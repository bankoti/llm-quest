<text x="479.0" y="109.0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">timeout expires</text>
<line x1="580" y1="80" x2="580" y2="50" stroke="#4b5563" stroke-width="1.6"/>
<line x1="580" y1="50" x2="575.3604876536068" y2="42.28800121967947" stroke="#4b5563" stroke-width="1.6"/>
<line x1="580" y1="50" x2="584.6395123463932" y2="42.28800121967948" stroke="#4b5563" stroke-width="1.6"/>
<line x1="580" y1="50" x2="140" y2="50" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<line x1="140" y1="50" x2="140" y2="78" stroke="#4b5563" stroke-width="1.6"/>
<line x1="140" y1="78" x2="144.6395123463932" y2="85.71199878032053" stroke="#4b5563" stroke-width="1.6"/>
<line x1="140" y1="78" x2="135.3604876536068" y2="85.71199878032053" stroke="#4b5563" stroke-width="1.6"/>
<text x="360" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">probe succeeds → CLOSED</text>
<line x1="580" y1="152" x2="580" y2="196" stroke="#fb7185" stroke-width="1.6"/>
<line x1="580" y1="196" x2="584.6395123463932" y2="203.71199878032053" stroke="#fb7185" stroke-width="1.6"/>
<line x1="580" y1="196" x2="575.3604876536068" y2="203.71199878032053" stroke="#fb7185" stroke-width="1.6"/>
