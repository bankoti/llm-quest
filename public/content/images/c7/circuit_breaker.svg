<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="270" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">Circuit breaker: three states</text>
<rect x="60" y="80" width="160" height="70" rx="10" fill="#34d3991e" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="140" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#34d399" text-anchor="middle" font-weight="700" opacity="1">CLOSED</text>
<text x="140" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">normal</text>
<rect x="280" y="80" width="160" height="70" rx="10" fill="#fb71851e" stroke="#fb7185" stroke-width="1.5" opacity="1"/>
<text x="360" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#fb7185" text-anchor="middle" font-weight="700" opacity="1">OPEN</text>
<text x="360" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">fail-fast</text>
<rect x="500" y="80" width="160" height="70" rx="10" fill="#fbbf241e" stroke="#fbbf24" stroke-width="1.5" opacity="1"/>
<text x="580" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="700" opacity="1">HALF-OPEN</text>
<text x="580" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">probe</text>
<line x1="220" y1="115" x2="278" y2="115" stroke="#9ca3af" stroke-width="1.6"/>
<line x1="278" y1="115" x2="285.7119987803205" y2="110.36048765360682" stroke="#9ca3af" stroke-width="1.6"/>
