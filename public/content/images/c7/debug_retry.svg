<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="240" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">The bug: linear delay labeled &#x27;exponential backoff&#x27;</text>
<rect x="80" y="80" width="80" height="80" rx="3" fill="#fb718526" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="120.0" y="123.5" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">100ms</text>
<rect x="160" y="80" width="80" height="80" rx="3" fill="#fb718526" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="200.0" y="123.5" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">200ms</text>
<rect x="240" y="80" width="80" height="80" rx="3" fill="#fb718526" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="280.0" y="123.5" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">300ms</text>
<rect x="320" y="80" width="80" height="80" rx="3" fill="#fb718526" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="360.0" y="123.5" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">400ms</text>
<rect x="400" y="80" width="80" height="80" rx="3" fill="#fb718526" stroke="#1f2937" stroke-width="1" opacity="1"/>
<text x="440.0" y="123.5" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1">500ms</text>
<text x="120.0" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt 1</text>
<text x="200.0" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt 2</text>
<text x="280.0" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt 3</text>
<text x="360.0" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt 4</text>
<text x="440.0" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">attempt 5</text>
<text x="80" y="148" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#34d399" text-anchor="start" font-weight="400" opacity="1">correct exponential: 100 · 2^0 = 100,  · 2^1 = 200,  · 2^2 = 400 ...</text>
<text x="80" y="174" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">       what we have:    100,              200,              300 ... linear</text>
<text x="360" y="216" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">the sequence [100, 200, 300, 400, 500] STARTS like doubling but diverges at attempt 3</text>
</svg>
