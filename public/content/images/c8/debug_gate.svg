<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="240" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">The bug: checking the upper CI bound instead of the lower</text>
<line x1="100" y1="56" x2="100" y2="186" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<line x1="100" y1="186" x2="600" y2="186" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<text x="350.0" y="212" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">quality difference (new − old)</text>
<line x1="360" y1="56" x2="360" y2="194" stroke="#4b5563" stroke-width="1.2" opacity="1" stroke-dasharray="5,4"/>
<text x="360" y="48" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">0</text>
<line x1="480" y1="56" x2="480" y2="194" stroke="#fb7185" stroke-width="1.4" opacity="1" stroke-dasharray="4,3"/>
<text x="484" y="48" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">−δ margin</text>
<line x1="250" y1="126" x2="480" y2="126" stroke="#fbbf24" stroke-width="3" opacity="1"/>
<circle cx="366" cy="126" r="4" fill="#fbbf24" stroke="none" opacity="1"/>
<circle cx="250" cy="126" r="5" fill="#fb7185" stroke="none" opacity="1"/>
<circle cx="480" cy="126" r="5" fill="#34d399" stroke="none" opacity="1"/>
<text x="246" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fb7185" text-anchor="end" font-weight="400" opacity="1">lower CI</text>
<text x="484" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#34d399" text-anchor="start" font-weight="400" opacity="1">upper CI</text>
<text x="100" y="176" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">lower CI &lt; margin → GATE SHOULD BLOCK</text>
<text x="100" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="start" font-weight="400" opacity="1">but bug checks upper CI &gt; margin → passes anything (True if mean &gt; 0)</text>
<text x="360" y="226" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">&#x27;confident it is no worse&#x27; = LOWER end of the interval clears the bar — the pessimistic case</text>
</svg>
