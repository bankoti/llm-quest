<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="280" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">Superiority vs non-inferiority: two different claims</text>
<line x1="100" y1="60" x2="100" y2="220" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<line x1="100" y1="220" x2="600" y2="220" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<text x="350.0" y="246" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">metric difference (new − old)</text>
<line x1="350" y1="60" x2="350" y2="230" stroke="#4b5563" stroke-width="1.2" opacity="1" stroke-dasharray="5,4"/>
<text x="350" y="50" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">0</text>
<line x1="470" y1="60" x2="470" y2="230" stroke="#fb7185" stroke-width="1.5" opacity="1" stroke-dasharray="4,3"/>
<text x="474" y="50" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="400" opacity="1">−δ margin</text>
<line x1="380" y1="170" x2="490" y2="170" stroke="#34d399" stroke-width="3.5" opacity="1"/>
<circle cx="436" cy="170" r="5" fill="#34d399" stroke="none" opacity="1"/>
<text x="610" y="174" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="start" font-weight="400" opacity="1">non-inferior ✓</text>
<line x1="230" y1="130" x2="410" y2="130" stroke="#fb7185" stroke-width="3.5" opacity="1"/>
<circle cx="320" cy="130" r="5" fill="#fb7185" stroke="none" opacity="1"/>
<text x="610" y="134" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">fails: CI crosses margin</text>
<line x1="360" y1="90" x2="470" y2="90" stroke="#a78bfa" stroke-width="3.5" opacity="1"/>
<circle cx="416" cy="90" r="5" fill="#a78bfa" stroke="none" opacity="1"/>
<text x="610" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a78bfa" text-anchor="start" font-weight="400" opacity="1">superior (CI right of 0)</text>
<text x="360" y="264" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">non-inferiority claims &#x27;not meaningfully worse&#x27; — the CI must clear the margin, not just zero</text>
</svg>
