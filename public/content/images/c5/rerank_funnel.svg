<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Segoe UI', system-ui, sans-serif">
<rect width="720" height="260" fill="#0b0f19" rx="10"/>
<text x="360.0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">Two stages: cheap recall, expensive precision</text>
<rect x="60" y="54" width="600" height="38" rx="8" fill="#4b55631e" stroke="#4b5563" stroke-width="1.5" opacity="1"/>
<text x="360" y="71" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">corpus</text>
<text x="360" y="85" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">10,000,000 docs</text>
<rect x="150" y="104" width="420" height="38" rx="8" fill="#67e8f91e" stroke="#67e8f9" stroke-width="1.5" opacity="1"/>
<text x="360" y="121" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">retriever (bi-encoder / BM25)</text>
<text x="360" y="135" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">top 200 — fast, independent embeddings</text>
<rect x="250" y="154" width="220" height="38" rx="8" fill="#a78bfa1e" stroke="#a78bfa" stroke-width="1.5" opacity="1"/>
<text x="360" y="171" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">reranker (cross-encoder)</text>
<text x="360" y="185" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">top 10 — reads query+doc together</text>
<rect x="306" y="204" width="108" height="38" rx="8" fill="#34d3991e" stroke="#34d399" stroke-width="1.5" opacity="1"/>
<text x="360" y="221" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e5e7eb" text-anchor="middle" font-weight="600" opacity="1">answer context</text>
<text x="360" y="235" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">3–5 passages</text>
<text x="360" y="246" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">the reranker is too slow for the corpus and the retriever too coarse for the answer —</text>
<text x="360" y="260" font-family="'Segoe UI', system-ui, sans-serif" font-size="1" fill="#e5e7eb" text-anchor="middle" font-weight="400" opacity="1"></text>
</svg>
