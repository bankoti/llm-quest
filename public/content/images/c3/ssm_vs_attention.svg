<text x="540" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">state size is CONSTANT: each step folds the token in</text>
<text x="540" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">and irreversibly compresses the past</text>
<text x="360" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">the tradeoff is addressability: attention can point at any earlier token, an SSM cannot</text>
