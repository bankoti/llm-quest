<text x="520" y="142" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">H = query heads = 32 ✗</text>
<text x="520" y="164" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#fb7185" text-anchor="start" font-weight="400" opacity="1">→ 4× overcount</text>
<text x="360" y="208" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="400" opacity="1">GQA exists precisely so the cache scales with KV heads, not query heads</text>
